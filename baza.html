<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tibbiy jihozlar bazasi</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#ececec; --form:#f0f0f0; --panel:#ffffff; --fg:#000; --dim:#444; --faint:#777;
  --line:#abadb3; --linehi:#3c7fb1; --head:#d9d9d9; --tab:#e4e4e4; --tabon:#f0f0f0;
  --accent:#1a5fa0; --onaccent:#fff; --sel:#cce4f7; --row:#fff; --row2:#f7f7f7;
  --ok:#2e7d32; --warn:#b26a00; --stop:#c62828;
  --font:Tahoma,"Segoe UI",system-ui,sans-serif; --mono:Consolas,"Space Mono",monospace;
  --r:3px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0E22; --form:#111633; --panel:#161c3f; --fg:#E7EAF6; --dim:#98A1C4; --faint:#66709A;
  --line:rgba(255,255,255,.16); --linehi:#5EEAD4; --head:#1b2250; --tab:#131a3d; --tabon:#1f2756;
  --accent:#5EEAD4; --onaccent:#062229; --sel:rgba(94,234,212,.18); --row:#161c3f; --row2:#141a3a;
  --ok:#5EEAD4; --warn:#FBBF6E; --stop:#FB7B8E;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
input[type=text],input[type=date],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px 5px;min-height:24px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--linehi);box-shadow:0 0 0 2px rgba(60,127,177,.25)}
input[readonly],textarea[readonly]{background:var(--panel)}
.btn{background:linear-gradient(#fdfdfd,#e3e3e3);border:1px solid #8e8f8f;border-radius:var(--r);padding:4px 14px;cursor:pointer;min-height:26px;color:#000}
.btn:hover{border-color:var(--linehi);background:linear-gradient(#eaf6fd,#bee6fd)}
:root[data-theme="dark"] .btn{background:var(--panel);border-color:var(--line);color:var(--fg)}
:root[data-theme="dark"] .btn:hover{border-color:var(--linehi)}
.btn.pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}
.hidden{display:none!important}

/* --- Access oynasi --- */
.win{background:var(--form);border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.18);margin:10px auto;max-width:1500px;overflow:hidden}
.wt{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--head);border-bottom:1px solid var(--line);font-weight:600}
.wt .sp{flex:1}
.wt .x{background:none;border:0;font-size:16px;cursor:pointer;padding:0 6px;line-height:1}
.tb{display:flex;gap:6px;padding:6px 10px;border-bottom:3px solid #1a3a7a;background:var(--form);align-items:center;flex-wrap:wrap}
.tb h2{margin:0 auto;font-size:17px;font-weight:700}
.frm{padding:10px 12px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:4px 28px}
.row{display:grid;grid-template-columns:185px 1fr;align-items:center;gap:6px;min-height:28px}
.row label{line-height:1.15}
.row.dd{grid-template-columns:185px 1fr 24px 1fr}
.row .po{text-align:center;color:var(--dim)}
.row.w2{grid-template-columns:185px 1fr 120px 1fr}
.grp{display:contents}
@media (max-width:980px){.frm{grid-template-columns:1fr}}
@media (max-width:640px){.row,.row.dd,.row.w2{grid-template-columns:1fr}.row .po{display:none}}

/* --- natija jadvali --- */
.res{padding:6px 12px 12px}
.res .cnt{display:flex;align-items:center;gap:10px;margin:4px 0 6px;color:var(--dim)}
.res .cnt .sp{flex:1}
.gridbox{overflow:auto;border:1px solid var(--line);background:var(--panel);max-height:60vh}
table.g{border-collapse:collapse;width:100%;min-width:1100px;font-size:12.5px}
table.g th{position:sticky;top:0;background:var(--head);border:1px solid var(--line);padding:5px 6px;text-align:left;font-weight:700;cursor:pointer;white-space:nowrap;user-select:none}
table.g th .ar{color:var(--faint);font-size:10px;margin-left:3px}
table.g td{border:1px solid var(--line);padding:4px 6px;vertical-align:top}
table.g tbody tr{cursor:pointer;background:var(--row)}
table.g tbody tr:nth-child(even){background:var(--row2)}
table.g tbody tr:hover{background:var(--sel)}
table.g td.n{font-family:var(--mono);white-space:nowrap}
.pg{display:flex;gap:6px;align-items:center;margin-top:6px;color:var(--dim)}

/* --- Изделия kartochkasi --- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto}
.card{background:var(--form);border:1px solid var(--line);border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.45);width:min(1380px,100%);margin:auto}
.hdr{display:grid;grid-template-columns:110px 120px 90px 1fr 140px 150px 1fr;gap:6px 8px;align-items:center;padding:8px 12px;background:#e9ecf5;border-bottom:1px solid var(--line)}
:root[data-theme="dark"] .hdr{background:var(--head)}
.hdr b.t{font-size:16px;text-align:center}
.hdr .k{font-weight:700}
.hdr input,.hdr select{min-height:24px}
@media (max-width:900px){.hdr{grid-template-columns:110px 1fr;}.hdr b.t{grid-column:1/-1}}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);background:var(--form);flex-wrap:wrap}
.tabs button{background:var(--tab);border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;padding:5px 12px;cursor:pointer;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--tabon);position:relative;top:1px}
.tp{padding:12px 14px;min-height:420px}
.fr{display:grid;grid-template-columns:190px 1fr;gap:6px 10px;align-items:start;max-width:1100px}
.fr label{font-weight:700;padding-top:4px}
.v{min-height:24px;padding:3px 6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);white-space:pre-wrap;word-break:break-word}
.v.n{font-family:var(--mono)}
.v.e{color:var(--faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;align-items:start}
.two.h div{text-align:center;font-weight:700;margin-bottom:4px}
.c3{display:grid;grid-template-columns:150px 1fr 1fr;gap:6px 10px;align-items:start}
.c3 label{font-weight:700;padding-top:4px}
.sec{font-weight:700;margin:10px 0 4px;border-bottom:1px solid var(--line);padding-bottom:2px}
.pz{display:grid;grid-template-columns:150px repeat(var(--n,4),1fr);gap:4px 8px;align-items:center}
.pz .h{font-weight:700;text-align:center}
.pz label{font-weight:700}
.pz .v{min-height:24px;padding:3px 6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);word-break:break-word}
.pz .v.n{font-family:var(--mono)}
table.pl{border-collapse:collapse;width:100%}
table.pl th,table.pl td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
table.pl th{background:var(--head)}
.note{color:var(--dim);font-size:12px;margin-top:8px}
.ft{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.ft .sp{flex:1}

/* --- qisqa ko'rinish (Ish kartochkasi) --- */
.sum{--bg:#0A0E22;--panel:rgba(255,255,255,.045);--line:rgba(255,255,255,.10);--fg:#E7EAF6;--dim:#98A1C4;--faint:#66709A;--accent:#5EEAD4;--ok:#A78BFA;
  background:#0A0E22;color:#E7EAF6;font-family:"Space Grotesk",system-ui,sans-serif;border-radius:14px;width:min(1180px,100%);margin:auto;padding:22px 26px 30px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.sum .mono{font-family:"Space Mono",monospace}
.sum .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}

.sum .tag.a{background:rgba(94,234,212,.08);color:#5EEAD4}

.sum h1{margin:6px 0 0;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.sum .sub{margin:4px 0 0;color:#98A1C4;font-size:14px}
.sum .hd{padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.10);margin-bottom:14px}
.sum .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sum section{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.10);border-radius:14px;overflow:hidden;margin-bottom:14px}
.sum h2{margin:0;padding:10px 16px;font-size:14px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.10)}
.sum dl{margin:0;padding:8px 16px 10px;display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.sum dt{color:#98A1C4}.sum dd{margin:0}
.sum .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.sum .g4>div{padding:10px 14px;border-right:1px solid rgba(255,255,255,.08)}

.sum h3{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:#98A1C4;font-weight:500}
.sum p{margin:0 0 4px;font-size:13px}
.sum small{color:#98A1C4;font-family:"Space Mono",monospace;font-size:11.5px}
.sum table{width:100%;border-collapse:collapse;font-size:13px}
.sum th{text-align:left;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.10);font-weight:500;color:#98A1C4;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.sum td{padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
@media (max-width:800px){.sum .g2,.sum .g4{grid-template-columns:1fr}.sum .g4>div{border-right:0;border-bottom:1px solid rgba(255,255,255,.08)}}

/* --- holat --- */
#st{padding:40px 20px;text-align:center;color:var(--dim)}
#st .bar{height:6px;background:var(--line);border-radius:3px;max-width:420px;margin:12px auto;overflow:hidden}
#st .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.err{color:var(--stop)}
</style>

<script>
"use strict";
const FB_CONFIG={apiKey:"AIzaSyBeZKgyvUInhF0K4xw4amfP1echBlu0wl0",authDomain:"tekshiruv-88c03.firebaseapp.com",projectId:"tekshiruv-88c03",
  storageBucket:"tekshiruv-88c03.firebasestorage.app",messagingSenderId:"989419587759",appId:"1:989419587759:web:052e115735c4ff6d86ac5a"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]||c));
const C=BazaCore;
const LOCAL=new URLSearchParams(location.search).has("local");
const P=C.IDX_POS;
let META=null, IDX=[], SPR=null, FIRMA={}, ADRES={}, PIDX=null, RES=[], PAGE=0, SORT={k:"Док_ном",d:-1}, SESS=null, DB=null;
const FULL={};  // paket raqami -> {id: rec}

/* ================= saqlash (IndexedDB) ================= */
const IDBN="tj_baza", IDBS="paket";
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDBN,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDBS); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function cacheGet(k){ try{ const d=await idb(); return await new Promise((res,rej)=>{ const t=d.transaction(IDBS).objectStore(IDBS).get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }catch(e){ return null; } }
async function cachePut(k,v){ try{ const d=await idb(); await new Promise((res,rej)=>{ const t=d.transaction(IDBS,"readwrite").objectStore(IDBS).put(v,k); t.onsuccess=res; t.onerror=()=>rej(t.error); }); }catch(e){} }

/* ================= paketlarni olish ================= */
async function rawDoc(name){
  if(LOCAL){ const r=await fetch("baza-data/"+(name==="meta"?"meta.json":name+".gz")); if(!r.ok) throw new Error(name+" topilmadi"); return name==="meta"?await r.json():new Uint8Array(await r.arrayBuffer()); }
  const s=await DB.collection("baza").doc(name).get();
  if(!s.exists) throw new Error("Paket yo'q: "+name);
  const d=s.data(); return name==="meta"?d:d.gz.toUint8Array();
}
async function paket(name){                 // gz paket -> obyekt (kesh bilan)
  const ck=name+"@"+META.ver;
  let u8=await cacheGet(ck);
  if(!u8){ u8=await rawDoc(name); await cachePut(ck,u8); }
  return JSON.parse(await C.gunzipToStr(u8));
}
function holat(t,p){ $("stt").textContent=t||""; if(p!=null) $("stb").style.width=Math.round(p*100)+"%"; }

async function yukla(){
  META=await rawDoc("meta");
  const ishlar=[]; for(let i=0;i<META.idx;i++) ishlar.push("idx_"+i);
  const firm=[]; for(let i=0;i<(META.firma||0);i++) firm.push("firma_"+i);
  const adr=[]; for(let i=0;i<(META.adres||0);i++) adr.push("adres_"+i);
  const all=["spr",...firm,...adr,...ishlar]; let k=0;
  const out={};
  for(const n of all){ holat("Yuklanmoqda: "+n, k/all.length); out[n]=await paket(n); k++; }
  SPR=out.spr;
  for(const n of firm) Object.assign(FIRMA,out[n]);
  for(const n of adr) Object.assign(ADRES,out[n]);
  for(const n of ishlar) for(const r of out[n]) IDX.push(r);
  holat("Tayyor",1);
}
async function toliq(id){                   // bitta ishning to'liq yozuvi
  const ch=Math.floor(id/META.fullChunk);
  if(!FULL[ch]) FULL[ch]=await paket("full_"+ch);
  return FULL[ch][id]||null;
}

const low=s=>String(s||"").toLowerCase();

function inRange(d,a,b){ if(!a&&!b) return true; if(!d) return false; if(a&&d<a) return false; if(b&&d>b) return false; return true; }
async function qidir(){
  const g=id=>$(id).value.trim();
  const kod=g("f_kod"), arxiv=low(g("f_arxiv")), dog=low(g("f_dog")), gu=low(g("f_gu")), tipstr=g("f_tipstr"), strana=g("f_strana"), naim=low(g("f_naim")),
    firma=g("f_firma"), derj=g("f_derj"), zayav=g("f_zayav"), eksp=g("f_eksp"), lab=g("f_lab"), klin=g("f_klin"), pril=low(g("f_pril")), norm=low(g("f_norm")),
    vopr=g("f_vopr"), eksresh=g("f_eksresh"), sdel=g("f_sdel"), sopl=g("f_sopl"), sreg=g("f_sreg"), reestr=g("f_reestr"), ispoln=g("f_ispoln"), papka=g("f_papka"), status=g("f_status");
  const dd=k=>[g("d_"+k+"1"),g("d_"+k+"2")];
  const [dog1,dog2]=dd("dog"),[kart1,kart2]=dd("kart"),[dok1,dok2]=dd("dok"),[prez1,prez2]=dd("prez"),[eks1,eks2]=dd("eks"),[reg1,reg2]=dd("reg"),[pereg1,pereg2]=dd("pereg"),[korr1,korr2]=dd("korr"),[zab1,zab2]=dd("zab");
  const fF=firma?firmaIds(firma):null, fD=derj?firmaIds(derj):null, fZ=zayav?firmaIds(zayav):null;
  const stranaTip=tipstr?new Set(Object.keys(SPR.strany).filter(k=>SPR.strany[k]["Тип_страны"]===tipstr)):null;
  let prilIds=null;
  if(pril){ const px=await prilIndeks(); prilIds=new Set(); for(const [id,n] of px) if(low(n).includes(pril)) prilIds.add(String(id)); }
  const out=[];
  for(const r of IDX){
    const id=v(r,"Док_ном");
    if(kod&&id!==kod) continue;
    if(arxiv&&!low(v(r,"ном_архив")).includes(arxiv)) continue;
    if(dog&&!low(v(r,"Ном_договора")).includes(dog)) continue;
    if(gu&&!low(v(r,"Код_док_ГУ")).includes(gu)) continue;
    if(strana&&v(r,"Страна")!==strana) continue;
    if(stranaTip&&!stranaTip.has(v(r,"Страна"))) continue;
    if(naim&&!(low(v(r,"Наим_изделия")).includes(naim)||low(v(r,"Наим_издел_lat")).includes(naim)||low(v(r,"Наим_издел_мнр")).includes(naim))) continue;
    if(fF&&!fF.has(v(r,"Фирма_произв"))) continue;
    if(fD&&!fD.has(v(r,"Держатель РУ"))) continue;
    if(fZ&&!fZ.has(v(r,"Представитель"))) continue;
    if(eksp&&![1,2,3,4].some(i=>v(r,"Эксп_"+i)===eksp)) continue;
    if(lab&&![1,2,3,4,5].some(i=>v(r,"Лаб_"+i)===lab)) continue;
    if(klin&&![1,2,3].some(i=>v(r,"Клин_"+i)===klin)) continue;
    if(prilIds&&!prilIds.has(id)) continue;
    if(norm&&!low(v(r,"Нормдок")).includes(norm)) continue;
    if(vopr&&![1,2,3,4].some(i=>v(r,"Вопр"+i+"_през")===vopr)) continue;
    if(eksresh&&v(r,"Эксп_реш")!==eksresh) continue;
    if(sdel&&v(r,"Сост_дел")!==sdel) continue;
    if(sopl&&v(r,"Сост_опл")!==sopl) continue;
    if(sreg&&v(r,"Сост_рег")!==sreg) continue;
    if(reestr&&v(r,"Реестр")!==reestr) continue;
    if(ispoln&&v(r,"Исполнит")!==ispoln) continue;
    if(papka&&v(r,"папка")!==papka) continue;
    if(status&&v(r,"Статус")!==status) continue;
    if(!inRange(v(r,"Дата_догов"),dog1,dog2)) continue;
    if(!inRange(v(r,"Дата_карточки"),kart1,kart2)) continue;
    if(!inRange(v(r,"Док_дат"),dok1,dok2)) continue;
    if((prez1||prez2)&&![1,2,3,4].some(i=>v(r,"През_"+i+"_дат")&&inRange(v(r,"През_"+i+"_дат"),prez1,prez2))) continue;
    if(!inRange(v(r,"Эксп_дат"),eks1,eks2)) continue;
    if(!inRange(v(r,"Рег_дат1"),reg1,reg2)) continue;
    if(!inRange(v(r,"Рег_дат2"),pereg1,pereg2)) continue;
    if(!inRange(v(r,"Дата_корр"),korr1,korr2)) continue;
    if(!inRange(v(r,"Дата_забора"),zab1,zab2)) continue;
    out.push(r);
  }
  RES=out; PAGE=0; sarala(); chiz();
  $("rcnt").textContent="Topildi: "+RES.length.toLocaleString("ru")+" ta ish";
}
function sarala(){
  const k=SORT.k, d=SORT.d;

  RES.sort((a,b)=>{ const x=key(a),y=key(b); if(x===y) return 0; if(x===""||x==null) return 1; if(y===""||y==null) return -1; return (x<y?-1:1)*d; });

async function ochKarta(id,tab){
  $("ovCard").classList.remove("hidden"); $("ovCard").innerHTML=`<div class="card"><div class="wt">Изделия<span class="sp"></span><button class="x" onclick="yopKarta()">✕</button></div><div class="tp">Yuklanmoqda…</div></div>`;

  CUR={id,r}; tab=tab||"izd";
  $("ovCard").innerHTML=`<div class="card">
    <div class="wt">Изделия<span class="sp"></span><button class="btn" onclick="ochQisqa()">Qisqa ko'rinish</button><button class="btn" onclick="window.print()">Chop etish</button><button class="x" onclick="yopKarta()" aria-label="Yopish">✕</button></div>

  </div>`;
  $("ovCard").querySelector(".tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-t]"); if(!b) return;

function yopKarta(){ $("ovCard").classList.add("hidden"); $("ovCard").innerHTML=""; }
function yopQisqa(){ $("ovSum").classList.add("hidden"); $("ovSum").innerHTML=""; }
function ochQisqa(){
  if(!CUR) return; const r=CUR.r, id=CUR.id;
  const li=(label,val,mono)=>`<dt>${label}</dt><dd${mono?' class="mono"':''}>${esc(val||"—")}</dd>`;
  const eks=[1,2,3,4].filter(i=>r["Эксп_"+i]).map(i=>`<p>${i}. ${esc(nm.ekspert(r["Эксп_"+i]))} <small>${D(r["Эксп_дат_"+i])}${r["Экспр_"+i]?" · "+esc(nm.razr(r["Экспр_"+i])):""}</small></p>`).join("")||"<p><small>—</small></p>";
  const lab=[1,2,3,4,5].filter(i=>r["Лаб_"+i]).map(i=>`<p>${i}. ${esc(nm.lab(r["Лаб_"+i]))} <small>${D(r["Лаб_дат_"+i])}${r["Лабр_"+i]?" · "+esc(nm.razr(r["Лабр_"+i])):""}</small></p>`).join("")||"<p><small>—</small></p>";
  const kl=[1,2,3].filter(i=>r["Клин_"+i]).map(i=>`<p>${i}. ${esc(nm.klin(r["Клин_"+i]))} <small>${D(r["Клин_дат_"+i])}</small></p>`).join("")||"<p><small>—</small></p>";
  const pz=[1,2,3,4].filter(i=>r["През_"+i+"_ном"]).map(i=>`<p>Президиум № ${esc(r["През_"+i+"_ном"])} <small>${D(r["През_"+i+"_дат"])}${r["Реш_през"+i]?" · "+esc(nm.reshPrez(r["Реш_през"+i])):""}</small></p>`).join("")+
    (r["Эксп_ном"]?`<p>Эксп. совет № ${esc(r["Эксп_ном"])} <small>${D(r["Эксп_дат"])}${r["Эксп_реш"]?" · "+esc(nm.reshEksov(r["Эксп_реш"])):""}</small></p>`:"");
  const p=r.pr||[];
  $("ovSum").classList.remove("hidden");
  $("ovSum").innerHTML=`<div class="sum">
    <div class="top"><button class="pill" onclick="yopQisqa()">‹ Kartochkaga qaytish</button><span class="mono" style="font-size:11px;color:#98A1C4">Tibbiy jihozlar bazasi · Ish kartochkasi</span><span style="flex:1"></span><button class="pill" onclick="window.print()">Chop etish</button></div>
    <div class="hd"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="mono" style="font-size:13px;color:#5EEAD4">№ папки ${id}</span>
      ${r["Реестр"]?`<span class="tag o">Реестр: ${esc(nm.reestr(r["Реестр"]))}</span>`:""}${r["Сост_дел"]?`<span class="tag a">Сост. дела: ${esc(nm.sdel(r["Сост_дел"]))}</span>`:""}${r["Сост_рег"]?`<span class="tag">Сост. рег.: ${esc(nm.sreg(r["Сост_рег"]))}</span>`:""}</div>
      <h1>${esc(r["Наим_изделия"]||"—")}</h1><p class="sub">${esc(r["Наим_издел_lat"]||"")}${r["Наим_издел_мнр"]?` · <span style="color:#66709A">${esc(r["Наим_издел_мнр"])}</span>`:""}</p></div>
    <div class="g2">
      <section><h2>Asosiy ma'lumotlar</h2><dl>${li("Дата поступления",D(r["Док_дат"]),1)}${li("Дата карточки",D(r["Дата_карточки"]),1)}${li("Фирма-Производитель",nm.firma(r["Фирма_произв"]))}${li("Страна",nm.strana(r["Страна"]))}${li("Заявитель",nm.firma(r["Представитель"]))}${li("Держатель РУ",nm.firma(r["Держатель РУ"]))}${li("Направление",r["Направл"])}${li("Исполнитель",nm.ispoln(r["Исполнит"]))}${li("Статус",nm.status(r["Статус"]))}</dl></section>
      <section><h2>Ro'yxatga olish va shartnoma</h2><dl>${li("Рег. номер",r["Рег_ном"],1)}${li("Дата регистрации",D(r["Рег_дат1"]),1)}${li("Рег. номер 2",r["Рег_ном2"],1)}${li("Дата перерегистрации",D(r["Рег_дат2"]),1)}${li("№ договора",r["Ном_договора"],1)}${li("Дата договора",D(r["Дата_догов"]),1)}${li("Номер архива",r["ном_архив"],1)}${li("Место регистрации",r["Местрег"])}</dl></section>
    </div>
    <section><h2>Ekspertiza jarayoni</h2><div class="g4"><div><h3>Эксперты</h3>${eks}</div><div><h3>Лаборатории</h3>${lab}</div><div><h3>Клиники</h3>${kl}</div><div><h3>Президиум · Эксп. совет</h3>${pz||"<p><small>—</small></p>"}</div></div></section>
    <section><h2>Приложение <small>${p.length} ta pozitsiya</small></h2>${p.length?`<div style="overflow-x:auto"><table><thead><tr><th style="width:56px">№</th><th>Наименование приложения</th></tr></thead><tbody>${p.map((x,i)=>`<tr><td class="mono" style="color:#98A1C4">${i+1}</td><td>${esc(x[3]||x[2])}</td></tr>`).join("")}</tbody></table></div>`:`<p style="padding:10px 16px;color:#98A1C4">Ilova yo'q.</p>`}</section>
    <p style="font-size:12px;color:#98A1C4;margin:0">Summalar, rekvizitlar, xatlar bu yerda ko'rsatilmaydi. Tahrirlash yo'q.</p>
  </div>`;
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(!$("ovSum").classList.contains("hidden")) yopQisqa(); else if(!$("ovCard").classList.contains("hidden")) yopKarta(); } });

function authReady(){ return new Promise(res=>{ const un=firebase.auth().onAuthStateChanged(u=>{ un(); res(u); }); }); }
async function start(sess){
  SESS=sess||{role:"expert"};
  try{
    if(!LOCAL){ const u=await authReady(); if(!u) throw new Error("Tizimga kirilmagan — asosiy sahifadan qayta kiring."); }
    try{ await yukla(); }
    catch(e){ if(!LOCAL&&/permission/i.test(String(e.message||e))){ await new Promise(r=>setTimeout(r,2500)); holat("Qayta urinilmoqda…",0); IDX=[]; FIRMA={}; ADRES={}; await yukla(); } else throw e; }
  }catch(e){ const m=String(e.message||e);
    $("st").innerHTML=/permission/i.test(m)?`<span class="err">Sizga bu bo'limga ruxsat berilmagan.</span><p>Ruxsat uchun administratorga murojaat qiling.</p>`
      :`<span class="err">Bazani yuklab bo'lmadi: ${esc(m)}</span><p>Administrator bazani hali yuklamagan bo'lishi mumkin.</p>`; return; }
  sozla(); $("st").classList.add("hidden"); $("app").classList.remove("hidden");
}
window.BAZA={ start, theme:t=>{ document.documentElement.dataset.theme=t==="dark"?"dark":""; }, och:id=>ochKarta(+id) };
(function(){
  if(LOCAL){ start({role:"admin",name:"sinov"}); return; }
  firebase.initializeApp(FB_CONFIG); DB=firebase.firestore();
  const t=setTimeout(()=>{ firebase.auth().onAuthStateChanged(u=>{ if(u&&!SESS) start({role:"expert"}); else if(!u) $("st").innerHTML='<span class="err">Avval asosiy sahifadan tizimga kiring.</span>'; }); },1500);
  window.addEventListener("message",e=>{ if(e.data&&e.data.baza==="start"){ clearTimeout(t); if(!SESS) start(e.data.sess); } });
})();
